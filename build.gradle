buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
	}
}

ext.metaJava25JvmArgs = ['-XX:+UseCompactObjectHeaders', '--enable-native-access=ALL-UNNAMED']

apply from: "$rootDir/gradle/iteration-safety.gradle"
apply from: "$rootDir/gradle/duplicate-class-safety.gradle"

allprojects {
	apply plugin: 'eclipse'
	apply plugin: 'idea'
	apply plugin: 'maven-publish'
	ext.appName = 'Meta'

	configurations.all {
		exclude group: "com.badlogicgames.gdx", module: "gdx-backend-lwjgl"
	}
}

// If we add android exclude the project here
configure(subprojects) {
	apply plugin: 'kotlin'

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	kotlin {
		jvmToolchain(25)
	}

	publishing {
		publications {
			mavenJava(MavenPublication) {
				// Coordinates come from the project group (see `subprojects` below),
				// deliberately, not from an override here.
				//
				// JitPack rewrites the POM to `com.github.Frotty.Meta:<module>` and
				// leaves the Gradle module metadata saying `com.github.Frotty:Meta`.
				// Gradle discards metadata whose component does not match the request
				// and silently falls back to the POM, losing every variant a POM
				// cannot express — so `testFixtures(...)` could not resolve while the
				// fixture jar sat in the repository right beside the jar that did.
				//
				// Overriding only `groupId` here is not enough and is worth recording:
				// a feature capability is derived from the *project* group, so the
				// fixture still advertised `com.github.Frotty:runtime-test-fixtures`
				// against a consumer asking for `com.github.Frotty.Meta:...`. One
				// group, set once, keeps the POM, the metadata and the capabilities
				// agreeing.
				from components.java
			}
		}
	}
}

subprojects {
	// The coordinates JitPack actually serves under. Declaring them here rather than
	// letting JitPack rewrite them keeps the POM, the Gradle module metadata and the
	// derived feature capabilities all saying the same thing — see the publishing
	// block above for what went wrong when they disagreed.
	group = 'com.github.Frotty.Meta'
	version = '1.0.0-SNAPSHOT'

	repositories {
		mavenCentral {
			content {
				includeGroupByRegex "com\\.badlogicgames\\..*"
				includeGroupByRegex "org\\.jetbrains\\..*"
				includeGroup "org.jetbrains"
				includeGroup "org.slf4j"
				includeGroup "org.apache.commons"
				includeGroup "commons-io"
				includeGroup "commons-codec"
				includeGroup "org.tukaani"
				includeGroup "ch.qos.logback"
				includeGroupByRegex "org\\.junit\\..*"
				includeGroup "org.junit"
				includeGroup "org.apiguardian"
				includeGroup "org.opentest4j"
				includeGroup "org.lwjgl"
				includeGroup "org.jcraft"
				includeGroup "net.java.dev.jna"
				// required by jitpack
				includeGroup "org.sonatype.oss"
				includeGroup "org.apache"
			}
		}
		maven {
			url = uri("https://oss.sonatype.org/content/repositories/snapshots/")
			content {
				includeGroup "com.badlogicgames.gdx"
			}
		}
	}

	tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
		kotlinOptions {
			jvmTarget = "25"
			freeCompilerArgs += "-progressive"
			freeCompilerArgs += "-opt-in=kotlin.RequiresOptIn"
			freeCompilerArgs += "-jvm-default=no-compatibility"
		}
	}

	tasks.withType(Test).configureEach {
		jvmArgs rootProject.ext.metaJava25JvmArgs
	}
}

eclipse.project.name = 'MetaRuntime' + '-parent'
