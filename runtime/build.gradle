// Publishes `de.fatox.meta.test` as a test-fixtures variant so a consuming game
// can write the layout tests this repo's own guidance tells it to write. Without
// it GdxTestEnvironment lived in src/test and shipped nowhere, so `MetaLayout`
// was reachable downstream and the headless boot it needs was not.
apply plugin: 'java-test-fixtures'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-runtime'

dependencies {
	api "com.badlogicgames.gdx:gdx:$gdxVersion"
	api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
	implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
	implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion"

	implementation "org.apache.commons:commons-compress:$commonsCompressVersion"
	// XZ backs Commons Compress' LZMA support but is not part of Meta's public API.
	implementation "org.tukaani:xz:$xzVersion"
	api "org.slf4j:slf4j-api:$slf4jVersion"

	// `api`, not `implementation`: GdxTestEnvironment's whole job is booting this
	// backend, so anything using the fixture needs it on the classpath too.
	testFixturesApi "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
	// The natives have to travel with the fixture, not just sit in this project's
	// own testRuntimeOnly. A consumer that resolved the fixture without them got
	// as far as booting and then died on "Couldn't load shared library 'gdx64.dll'"
	// — the fixture is only useful if it brings what HeadlessApplication needs.
	testFixturesRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
	testFixturesRuntimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"

	testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlinVersion"
	testImplementation "org.jetbrains.kotlin:kotlin-reflect:$kotlinVersion"
	testImplementation "org.junit.jupiter:junit-jupiter:$junit5Version"
	// Headless libGDX backend (+ native libs) so scene2d layout (Table/Cell) can be exercised in plain unit tests.
	testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
	testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
	testRuntimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

tasks {
	test {
		useJUnitPlatform()
		// The frame-cost gates belong to perfCheck alone. Left in, they ran twice per build, and a budget
		// regression failed this step instead of the one named for it - so CI reported "a test broke" and never
		// reached the step whose whole purpose is to say which budget moved.
		filter {
			excludeTestsMatching 'de.fatox.meta.perf.*'
		}
	}
}

/**
 * Deterministic frame-cost gates, separated from the ordinary suite so a budget regression reads as its own
 * failure rather than as "a test broke".
 *
 * These assert on counts - texture binds, draw calls, bytes allocated per frame - never on durations, so they are
 * stable on a shared CI runner. See FrameBudgetTest for why that distinction is the whole design.
 */
tasks.register('perfCheck', Test) {
	group = 'verification'
	description = 'Runs the frame-cost budget gates (draw calls, texture binds, per-frame allocation).'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter { includeTestsMatching 'de.fatox.meta.perf.*' }
	// Counting allocations means the measurement must not be perturbed by the measurer, and a shared daemon
	// carries JIT state from whatever ran before it.
	forkEvery = 0
	testLogging { showStandardStreams = true }
	// Never satisfied from the up-to-date check or the build cache. These gates measure what this JVM on this
	// machine actually did; replaying a previous run's verdict would report a pass nobody observed.
	outputs.upToDateWhen { false }
}
