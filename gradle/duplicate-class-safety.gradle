/*
 * Rejects the same fully-qualified class name being produced by more than one module.
 *
 * Kotlin names a file's class after the file, so two `MetaDataKeys.kt` in package `de.fatox.meta` - one in
 * `runtime`, one in `editor` - both became `de.fatox.meta.MetaDataKeysKt`. Every module compiled, every test
 * passed, and the application died at startup with NoSuchMethodError for a method that existed: on the combined
 * classpath the editor's class came first and shadowed the runtime's.
 *
 * Nothing else in the build could have caught that. Compilation sees one module at a time and the test suites run
 * per module, so the collision only exists once the jars are on one classpath. This check is the seam.
 */

def duplicateClassTask = tasks.register('verifyNoDuplicateClasses') {
	group = 'verification'
	description = 'Rejects the same fully-qualified class name being produced by more than one module.'

	// Depend on the classes, do not merely declare them as inputs. An input file tree is something to *watch*,
	// not something to build: on a clean checkout this task ran in a second, scanned empty directories and passed
	// the exact collision it exists to reject. The task paths are strings so they resolve lazily - this file is
	// applied before the java plugin reaches the subprojects.
	dependsOn(subprojects.collect { module -> "${module.path}:classes" })

	def moduleOutputs = subprojects.collectEntries { module ->
		[(module.name): module.fileTree("build/classes/kotlin/main") { include '**/*.class' }]
	}
	inputs.files(moduleOutputs.values())

	doLast {
		def ownersByClass = [:].withDefault { [] as Set }
		def scanned = 0
		moduleOutputs.each { moduleName, tree ->
			tree.visit { detail ->
				if (detail.isDirectory()) return
				// Kotlin emits `Foo$bar` helpers alongside `Foo`; the outer name is enough to spot a collision
				// and keeps the message readable.
				def className = detail.relativePath.pathString
					.replaceAll(/\.class$/, '')
					.replace('/', '.')
				if (className.contains('$')) return
				scanned++
				ownersByClass[className] << moduleName
			}
		}

		// A guard that finds nothing to inspect has to say so rather than report success. Wiring is the thing most
		// likely to rot here - a renamed output directory, a module that stops producing Kotlin - and every one of
		// those failures looks exactly like "no duplicates found".
		if (scanned == 0) {
			throw new GradleException(
				"verifyNoDuplicateClasses found no compiled classes to inspect, so it verified nothing. " +
					"Expected class files under <module>/build/classes/kotlin/main. Check that this task still " +
					"depends on the modules' `classes` tasks and that the output layout has not moved."
			)
		}

		def collisions = ownersByClass.findAll { className, owners -> owners.size() > 1 }
		if (!collisions.isEmpty()) {
			throw new GradleException(
				"The same class is produced by more than one module (${collisions.size()}):\n" +
					collisions.collect { className, owners ->
						"  - ${className}  <-  ${owners.sort().join(', ')}"
					}.join('\n') +
					"\nOn a combined classpath one silently shadows the other, so members that exist become " +
					"unreachable at runtime while every module still compiles and every test still passes.\n" +
					"Rename the file so its generated class name is unique, or move the declarations into a class " +
					"that is already module-specific."
			)
		}
	}
}

subprojects {
	tasks.matching { task -> task.name == 'check' }.configureEach {
		dependsOn(duplicateClassTask)
	}
}
