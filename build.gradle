buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
	}
}

ext.metaJava25JvmArgs = ['-XX:+UseCompactObjectHeaders', '--enable-native-access=ALL-UNNAMED']

apply from: "$rootDir/gradle/iteration-safety.gradle"
apply from: "$rootDir/gradle/duplicate-class-safety.gradle"

allprojects {
	apply plugin: 'eclipse'
	apply plugin: 'idea'
	apply plugin: 'maven-publish'
	ext.appName = 'Meta'

	configurations.all {
		exclude group: "com.badlogicgames.gdx", module: "gdx-backend-lwjgl"
	}
}

configure(subprojects) {
	apply plugin: 'kotlin'

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	kotlin {
		jvmToolchain(25)
	}

	publishing {
		publications {
			mavenJava(MavenPublication) {
				from components.java
			}
		}
	}
}

subprojects {
	// Use JitPack's group at the project level so the POM, Gradle metadata, and derived
	// test-fixture capabilities agree. A publication-only override leaves capabilities mismatched.
	group = 'com.github.Frotty.Meta'
	version = '1.0.0-SNAPSHOT'

	repositories {
		mavenCentral {
			content {
				includeGroupByRegex "com\\.badlogicgames\\..*"
				includeGroupByRegex "org\\.jetbrains\\..*"
				includeGroup "org.jetbrains"
				includeGroup "org.slf4j"
				includeGroup "org.apache.commons"
				includeGroup "commons-io"
				includeGroup "commons-codec"
				includeGroup "org.tukaani"
				includeGroup "ch.qos.logback"
				includeGroupByRegex "org\\.junit\\..*"
				includeGroup "org.junit"
				includeGroup "org.apiguardian"
				includeGroup "org.opentest4j"
				includeGroup "org.jspecify"
				includeGroup "org.lwjgl"
				includeGroup "org.jcraft"
				includeGroup "net.java.dev.jna"
				// required by jitpack
				includeGroup "org.sonatype.oss"
				includeGroup "org.apache"
			}
		}
		maven {
			url = uri("https://oss.sonatype.org/content/repositories/snapshots/")
			content {
				includeGroup "com.badlogicgames.gdx"
			}
		}
	}

	tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
		compilerOptions {
			jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
			progressiveMode.set(true)
			optIn.add('kotlin.RequiresOptIn')
			jvmDefault.set(org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.NO_COMPATIBILITY)
		}
	}

	tasks.withType(Test).configureEach {
		jvmArgs rootProject.ext.metaJava25JvmArgs
	}
}

eclipse.project.name = 'MetaRuntime' + '-parent'
