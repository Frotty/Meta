name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew verifyKotlinIterationSafety :runtime:compileKotlin :runtime-desktop:compileKotlin :editor:compileKotlin :editor-desktop:compileKotlin --no-daemon --stacktrace

      - name: Test
        run: ./gradlew :runtime:test --no-daemon --stacktrace

      # Deterministic frame-cost gates: texture binds, draw calls and bytes allocated per frame. These are counts,
      # not timings, so a noisy shared runner cannot flake them - which is what makes them safe to block a merge on.
      # Run as their own step so a budget regression is legible in the job list rather than buried in the suite.
      - name: Frame budgets
        run: ./gradlew :runtime:perfCheck --no-daemon --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: ignore
